services:
  app:
    # Don't restart the service when the command exits
    restart: "no"
    environment:
      DJANGO_SETTINGS_MODULE: {{ cookiecutter.module_name }}.settings
      DJANGO_WEBPACK_LOADER: webpack_loader.loader.FakeWebpackLoader
      DJANGO_SECRET_KEY: test-key
      # Disable manifest storage for testing
      DJANGO_STATICFILES_STORAGE: django.contrib.staticfiles.storage.StaticFilesStorage
    command: pytest -sv
